name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both native packages
        uses: actions/download-artifact@v4
        with:
          pattern: FinancialAutomation-*
          merge-multiple: true
          path: release-assets
      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "release-assets/Financial_Automation_Setup_${RELEASE_TAG#v}.exe"
          test -s release-assets/FinancialAutomation-macOS.zip
      - name: Publish native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Financial_Automation_Setup_*.exe
            release-assets/FinancialAutomation-macOS.zip

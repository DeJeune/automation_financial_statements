name: Native desktop
on:
  pull_request:
    paths: ['native/**', 'scripts/*native*', 'scripts/biome.*', 'biome.jsonc', 'installer.nsi', '.gitattributes', '.github/workflows/native.yml', '.github/workflows/release.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag, which must match the native application version
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
      FINANCIAL_DISABLE_UPDATE_CHECK: "1"
      FINANCIAL_DATA_DIR: ${{ github.workspace }}/native/target/test-data
    steps:
      - uses: actions/checkout@v4
      - name: Verify native version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' native/app/nsh.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid native version: $version" >&2
            exit 1
          fi
          for manifest in native/app/bridge/Cargo.toml native/engine/Cargo.toml; do
            test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' "$manifest")" = "$version" || {
              echo "Version mismatch in $manifest" >&2; exit 1;
            }
          done
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match native version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Restore caches only after all path dependencies exist. Cache setup may
      # create target directories, which bootstrap correctly rejects as an
      # unverified checkout when no revision marker is present.
      - name: Prepare pinned NSH sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1 -PrepareOnly
      - name: Prepare pinned NSH sources (macOS)
        if: runner.os != 'Windows'
        run: ./scripts/bootstrap-native.sh --prepare-only
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/.vendor/nsh
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build pinned NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Build pinned NSH (macOS)
        if: runner.os != 'Windows'
        run: ./scripts/bootstrap-native.sh
      - name: Lint, format and types (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-native.ps1
      - name: Lint, format and types (macOS)
        if: runner.os != 'Windows'
        run: ./scripts/check-native.sh
      - name: Rust regression tests
        run: cargo test --locked --manifest-path native/Cargo.toml -p financial-engine -p financial-desktop
      - name: UI tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & native/.vendor/nsh/target/debug/nsh.exe test native/app/App.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI tests (macOS)
        if: runner.os != 'Windows'
        run: native/.vendor/nsh/target/debug/nsh test native/app/App.test.tsx
      - name: Package Windows application
        env:
          NATIVE_VERSION: ${{ steps.version.outputs.version }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & native/.vendor/nsh/target/debug/nsh.exe package native/app/App.tsx --target windows --name FinancialAutomation -o native/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /DPRODUCT_VERSION=$env:NATIVE_VERSION /DDIST_DIR=native\package\FinancialAutomation installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path native/package/release -Force | Out-Null
          Copy-Item "Financial_Automation_Setup_$env:NATIVE_VERSION.exe" native/package/release/
      - name: Package macOS application
        if: runner.os != 'Windows'
        run: |
          native/.vendor/nsh/target/debug/nsh package native/app/App.tsx --target macos --name FinancialAutomation -o native/package
          mkdir -p native/package/release
          ditto -c -k --sequesterRsrc --keepParent native/package/FinancialAutomation.app native/package/release/FinancialAutomation-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialAutomation-${{ runner.os }}
          path: native/package/release/*
          if-no-files-found: error

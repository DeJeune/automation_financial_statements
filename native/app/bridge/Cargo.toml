[package]
name = "financial-desktop"
version = "2.0.0"
edition = "2024"

[dependencies]
financial-engine = { path = "../../engine" }
nsh-core = { path = "../../.vendor/nsh/crates/nsh-core" }
nsh-base = { path = "../../.vendor/nsh/crates/nsh-base" }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
tempfile = "3"
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

chrono = "0.4"
serde = { version = "1", features = ["derive"] }
directories = "6"
dotenvy = "0.15"
calamine = "0.37"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
